<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaScript DOM Manipulation</title>

<style>
body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:#f4f4f4;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
padding:30px;
width:400px;
text-align:center;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h1{
color:#333;
margin-bottom:15px;
}

p{
font-size:16px;
color:#555;
margin-bottom:20px;
}

input{
width:90%;
padding:10px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:5px;
font-size:16px;
}

.buttons{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
}

button{
padding:10px 15px;
border:none;
border-radius:5px;
background:#007bff;
color:white;
cursor:pointer;
font-size:14px;
transition:0.3s;
}

button:hover{
background:#0056b3;
}
</style>
</head>

<body>

<div class="container">

<h1 id="mainHeading">Welcome to JavaScript Lab</h1>

<p id="paragraph">
This paragraph will change size, hide/show, and respond to button actions.
</p>

<input type="text" id="userInput" placeholder="Enter new heading text">

<div class="buttons">

<button id="changeTextBtn">Change Text</button>

<button id="bgColorBtn">Background Color</button>

<button id="fontSizeBtn">Increase Font</button>

<button id="toggleBtn">Show / Hide</button>

<button id="resetBtn">Reset</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
